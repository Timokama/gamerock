{% extends 'base_f/base.html' %}

{% block page_title %}New Budget{% endblock %}
{% block styles %}{% endblock %}

{% block content %}
<div class="mg-form-container">
    <div class="mg-page-header">
        <h2>New Budget</h2>
        <a href="{{ url_for('budget.index') }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="mg-card">
        <div class="card-header">
            <h4>Budget Details</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="row">
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="name">Budget Name *</label>
                            <input type="text" id="name" name="name" placeholder="e.g. Q1 2025 Budget" required>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="fiscal_year">Fiscal Year *</label>
                            <input type="text" id="fiscal_year" name="fiscal_year" placeholder="e.g. 2025" required>
                        </div>
                    </div>
                </div>
                <div class="mg-form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Budget overview and goals..."></textarea>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="total_amount">Total Amount (Ksh)</label>
                            <input type="number" id="total_amount" name="total_amount" min="0" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="mg-form-group">
                    <label>Budget Items</label>
                    <div class="mg-budget-items" id="budget-items">
                        <div class="mg-budget-item">
                            <input type="text" name="category[]" placeholder="Category" required>
                            <input type="text" name="item_description[]" placeholder="Description">
                            <input type="number" name="amount[]" placeholder="Amount" min="0" value="0">
                            <select name="item_type[]">
                                <option value="Expense">Expense</option>
                                <option value="Income">Income</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="mg-btn-secondary" onclick="addBudgetItem()">+ Add Item</button>
                    <button type="button" class="mg-btn-danger" onclick="removeBudgetItem()">- Remove</button>
                </div>

                <div class="mg-form-actions">
                    <button type="submit" class="btn btn-primary">Create Budget</button>
                    <a href="{{ url_for('budget.index') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function addBudgetItem() {
    const container = document.getElementById('budget-items');
    const div = document.createElement('div');
    div.className = 'mg-budget-item';
    div.innerHTML = `
        <input type="text" name="category[]" placeholder="Category" required>
        <input type="text" name="item_description[]" placeholder="Description">
        <input type="number" name="amount[]" placeholder="Amount" min="0" value="0">
        <select name="item_type[]">
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
        </select>
    `;
    container.appendChild(div);
}

function removeBudgetItem() {
    const container = document.getElementById('budget-items');
    if (container.children.length > 1) {
        container.removeChild(container.lastChild);
    }
}
</script>
{% endblock %}
