{% extends "base_f/base.html" %}

{% block page_title %}Edit Budget{% endblock %}

{% block styles %}{% endblock %}

{% block content %}
<div class="mg-form-container">
    <div class="mg-page-header mb-6">
        <h2>Edit Budget</h2>
        <a href="{{ url_for('budget.view', budget_id=budget.id) }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="mg-card">
        <div class="card-header">
            <h4>Budget Details</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="row">
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="name">Budget Name *</label>
                            <input type="text" id="name" name="name" value="{{ budget.name }}" required>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="fiscal_year">Fiscal Year *</label>
                            <input type="text" id="fiscal_year" name="fiscal_year" value="{{ budget.fiscal_year }}" required>
                        </div>
                    </div>
                </div>
                <div class="mg-form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description">{{ budget.description or '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="total_amount">Total Amount (Ksh)</label>
                            <input type="number" id="total_amount" name="total_amount" value="{{ budget.total_amount }}" min="0">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="mg-form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="Draft" {% if budget.status == 'Draft' %}selected{% endif %}>Draft</option>
                                <option value="Approved" {% if budget.status == 'Approved' %}selected{% endif %}>Approved</option>
                                <option value="Active" {% if budget.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Closed" {% if budget.status == 'Closed' %}selected{% endif %}>Closed</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mg-form-group">
                    <label>Budget Items</label>
                    <div class="mg-budget-items" id="budget-items">
                        {% for item in budget.items %}
                        <div class="mg-budget-item">
                            <input type="text" name="category[]" value="{{ item.category }}" placeholder="Category" required>
                            <input type="text" name="item_description[]" value="{{ item.description or '' }}" placeholder="Description">
                            <input type="number" name="amount[]" value="{{ item.amount }}" placeholder="Amount" min="0">
                            <select name="item_type[]">
                                <option value="Expense" {% if item.item_type == 'Expense' %}selected{% endif %}>Expense</option>
                                <option value="Income" {% if item.item_type == 'Income' %}selected{% endif %}>Income</option>
                            </select>
                        </div>
                        {% else %}
                        <div class="mg-budget-item">
                            <input type="text" name="category[]" placeholder="Category" required>
                            <input type="text" name="item_description[]" placeholder="Description">
                            <input type="number" name="amount[]" placeholder="Amount" min="0" value="0">
                            <select name="item_type[]">
                                <option value="Expense">Expense</option>
                                <option value="Income">Income</option>
                            </select>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="button" class="mg-btn-secondary" onclick="addBudgetItem()">+ Add Item</button>
                    <button type="button" class="mg-btn-danger" onclick="removeBudgetItem()">- Remove</button>
                </div>

                <div class="mt-6">
                    <button type="submit" class="btn btn-primary">Update Budget</button>
                    <a href="{{ url_for('budget.view', budget_id=budget.id) }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function addBudgetItem() {
    const container = document.getElementById('budget-items');
    const div = document.createElement('div');
    div.className = 'mg-budget-item';
    div.innerHTML = `
        <input type="text" name="category[]" placeholder="Category" required>
        <input type="text" name="item_description[]" placeholder="Description">
        <input type="number" name="amount[]" placeholder="Amount" min="0" value="0">
        <select name="item_type[]">
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
        </select>
    `;
    container.appendChild(div);
}

function removeBudgetItem() {
    const container = document.getElementById('budget-items');
    if (container.children.length > 1) {
        container.removeChild(container.lastChild);
    }
}
</script>
{% endblock %}
