{% extends 'base_f/base.html' %}

{% block page_title %}New Meeting Minutes{% endblock %}
{% block styles %}{% endblock %}

{% block content %}
<div class="mg-form-container">
    <div class="mg-page-header">
        <h2>New Meeting Minutes</h2>
        <a href="{{ url_for('minutes.index') }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="mg-card">
        <div class="card-header">
            <h4>Meeting Details</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" name="title" placeholder="Meeting title" required>
                    </div>
                    <div class="mg-form-group">
                        <label for="meeting_type">Meeting Type</label>
                        <select id="meeting_type" name="meeting_type">
                            <option value="General">General</option>
                            <option value="Committee">Committee</option>
                            <option value="Annual">Annual</option>
                            <option value="Emergency">Emergency</option>
                        </select>
                    </div>
                </div>
                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="meeting_date">Meeting Date *</label>
                        <input type="date" id="meeting_date" name="meeting_date" required>
                    </div>
                    <div class="mg-form-group">
                        <label for="next_meeting_date">Next Meeting Date</label>
                        <input type="date" id="next_meeting_date" name="next_meeting_date">
                    </div>
                </div>
                <div class="mg-form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="Meeting location or platform">
                </div>
                <div class="mg-form-group">
                    <label for="attendees">Attendees</label>
                    <input type="text" id="attendees" name="attendees" placeholder="List of attendees">
                </div>
                <div class="mg-form-group">
                    <label for="agenda">Agenda</label>
                    <textarea id="agenda" name="agenda" placeholder="Meeting agenda items..."></textarea>
                </div>
                <div class="mg-form-group">
                    <label for="discussion">Discussion</label>
                    <textarea id="discussion" name="discussion" placeholder="Key discussion points..."></textarea>
                </div>
                <div class="mg-form-group">
                    <label for="decisions">Decisions</label>
                    <textarea id="decisions" name="decisions" placeholder="Decisions made..."></textarea>
                </div>
                <div class="mg-form-group">
                    <label for="action_items">Action Items</label>
                    <textarea id="action_items" name="action_items" placeholder="Action items and responsible persons..."></textarea>
                </div>
                <div class="mg-form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Draft">Draft</option>
                        <option value="Approved">Approved</option>
                        <option value="Archived">Archived</option>
                    </select>
                </div>
                <div class="mg-form-actions">
                    <button type="submit" class="btn btn-primary">Create Minutes</button>
                    <a href="{{ url_for('minutes.index') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
