{% extends 'base_f/base.html' %}

{% block page_title %}Edit Child{% endblock %}

{% block styles %}
<style>
.edit-form-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem;
}

.edit-form-container .card {
    border-radius: 18px;
    border: none;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    overflow: hidden;
}

.edit-form-container .card-header {
    background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    color: white;
    border: none;
    padding: 1.5rem 1.75rem;
}

.edit-form-container .card-header h4 {
    margin: 0;
    font-weight: 700;
    font-size: 1.3rem;
}

.edit-form-container .card-header p {
    margin: 0.25rem 0 0;
    opacity: 0.9;
    font-size: 0.88rem;
}

.edit-form-container .card-body {
    padding: 1.75rem;
    background: var(--card-bg);
}

.edit-form-container .form-label {
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.35rem;
    color: var(--text-color);
}

.edit-form-container .form-control {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border: 1.5px solid var(--border-color);
    border-radius: 12px;
    font-size: 0.92rem;
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 44px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.edit-form-container .form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
}

.edit-form-container .row .col-md-6 {
    margin-bottom: 1.25rem;
}

.edit-form-container .mb-3,
.edit-form-container .mb-4 {
    margin-bottom: 1.25rem;
}

.edit-form-container .mb-4 {
    margin-bottom: 1.5rem;
}

.edit-form-container .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
}

.edit-form-container .form-row .col-md-6 {
    flex: 1 1 220px;
    min-width: 0;
}

.edit-form-container .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
}

.edit-form-container .btn {
    padding: 0.6rem 1.5rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.edit-form-container .btn-primary {
    background: var(--primary-color);
    border: 1px solid var(--primary-color);
    color: white;
}

.edit-form-container .btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
}

.edit-form-container .action-btn.outline {
    background: transparent;
    border: 1.5px solid var(--border-color);
    color: var(--text-color);
    padding: 0.6rem 1.5rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.edit-form-container .action-btn.outline:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}

@media (max-width: 768px) {
    .edit-form-container {
        padding: 1rem;
    }

    .edit-form-container .card-body {
        padding: 1.25rem;
    }

    .edit-form-container .form-actions {
        flex-direction: column;
    }

    .edit-form-container .btn,
    .edit-form-container .action-btn.outline {
        width: 100%;
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .edit-form-container .card-header {
        padding: 1.25rem;
    }

    .edit-form-container .card-header h4 {
        font-size: 1.15rem;
    }

    .edit-form-container .card-body {
        padding: 1rem;
    }

    .edit-form-container .form-control {
        padding: 0.55rem 0.75rem;
        font-size: 0.85rem;
        min-height: 40px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="edit-form-container">
    <div class="card">
        <div class="card-header">
            <h4>Edit Child</h4>
            <p class="text-muted mt-2">Update child information</p>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="form-row">
                        <div class="col-md-6 mb-3">
                            <label for="firstname" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstname" name="firstname" value="{{ child.firstname }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastname" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastname" name="lastname" value="{{ child.lastname }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="surname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="surname" name="surname" value="{{ child.surname }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="date_of_birth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ child.date_of_birth }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone_num" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone_num" name="phone_num" value="{{ child.phone_num }}">
                    </div>

                    <div class="mb-4">
                        <label for="id_number" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="id_number" name="id_number" value="{{ child.id_number if child.id_number is not none else '' }}">
                    </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('family.family', depo_id=register.id) }}" class="action-btn outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
