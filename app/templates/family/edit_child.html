{% extends 'base_f/base.html' %}

{% block page_title %}Edit Child{% endblock %}

{% block styles %}
<style>
    .edit-form-container {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-6);
    }

    .edit-form-container .card {
        border-radius: var(--radius-xl);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: box-shadow var(--transition-base), transform var(--transition-base), border-color var(--transition-base);
    }

    .edit-form-container .card:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--border-medium);
    }

    .edit-form-container .card-header {
        background: linear-gradient(135deg, var(--warning-600) 0%, var(--danger-600) 100%);
        color: white;
        border: none;
        padding: var(--space-6) var(--space-7);
    }

    .edit-form-container .card-header h4 {
        margin: 0;
        font-weight: var(--font-weight-bold);
        font-size: var(--text-xl);
    }

    .edit-form-container .card-header p {
        margin: var(--space-1) 0 0;
        opacity: 0.9;
        font-size: var(--text-sm);
        color: rgba(255, 255, 255, 0.85);
    }

    .edit-form-container .card-body {
        padding: var(--space-7);
        background: var(--bg-secondary);
    }

    .edit-form-container .form-label {
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: var(--space-2);
        color: var(--text-primary);
    }

    .edit-form-container .form-control {
        width: 100%;
        padding: var(--space-3) var(--space-4);
        border: 1.5px solid var(--border-light);
        border-radius: var(--radius-lg);
        font-size: var(--text-sm);
        background: var(--bg-secondary);
        color: var(--text-primary);
        min-height: 44px;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        box-shadow: var(--shadow-xs);
        font-family: inherit;
    }

    .edit-form-container .form-control:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1), var(--shadow-xs);
        background: var(--bg-secondary);
    }

    .edit-form-container .row .col-md-6 {
        margin-bottom: var(--space-5);
    }

    .edit-form-container .mb-3,
    .edit-form-container .mb-4 {
        margin-bottom: var(--space-5);
    }

    .edit-form-container .mb-4 {
        margin-bottom: var(--space-6);
    }

    .edit-form-container .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-5);
    }

    .edit-form-container .form-row .col-md-6 {
        flex: 1 1 220px;
        min-width: 0;
    }

    .edit-form-container .form-actions {
        display: flex;
        gap: var(--space-3);
        margin-top: var(--space-6);
    }

    .edit-form-container .btn {
        padding: var(--space-3) var(--space-5);
        border-radius: var(--radius-lg);
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-sm);
        transition: all var(--transition-fast);
        font-family: inherit;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
    }

    .edit-form-container .btn-primary {
        background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
        color: white;
        box-shadow: var(--shadow-sm), 0 0 0 0 rgba(20, 184, 166, 0);
        border-color: transparent;
    }

    .edit-form-container .btn-primary:hover {
        opacity: 0.95;
        transform: translateY(-1px);
        box-shadow: var(--shadow-md), 0 0 0 3px rgba(20, 184, 166, 0.15);
        text-decoration: none;
    }

    .edit-form-container .btn-primary:focus-visible {
        outline: 2px solid var(--primary-500);
        outline-offset: 2px;
    }

    .edit-form-container .action-btn.outline {
        background: transparent;
        border: 1.5px solid var(--border-medium);
        color: var(--text-primary);
        padding: var(--space-3) var(--space-5);
        border-radius: var(--radius-lg);
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-sm);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
        font-family: inherit;
    }

    .edit-form-container .action-btn.outline:hover {
        border-color: var(--primary-500);
        color: var(--primary-600);
        background: var(--bg-tertiary);
        text-decoration: none;
    }

    .edit-form-container .action-btn.outline:focus-visible {
        outline: 2px solid var(--primary-500);
        outline-offset: 2px;
    }

    @media (max-width: 1024px) {
        .edit-form-container {
            padding: var(--space-5);
        }

        .edit-form-container .card-body {
            padding: var(--space-6);
        }
    }

    @media (max-width: 768px) {
        .edit-form-container {
            padding: var(--space-4);
        }

        .edit-form-container .card-body {
            padding: var(--space-5);
        }

        .edit-form-container .form-actions {
            flex-direction: column;
        }

        .edit-form-container .btn,
        .edit-form-container .action-btn.outline {
            width: 100%;
            justify-content: center;
        }
    }

    @media (max-width: 576px) {
        .edit-form-container .card-header {
            padding: var(--space-5);
        }

        .edit-form-container .card-header h4 {
            font-size: var(--text-lg);
        }

        .edit-form-container .card-body {
            padding: var(--space-4);
        }

        .edit-form-container .form-control {
            padding: var(--space-3) var(--space-3);
            font-size: var(--text-sm);
            min-height: 40px;
        }
    }

    [data-theme="dark"] .edit-form-container .card {
        box-shadow: var(--shadow-md);
        border-color: var(--secondary-700);
    }

    [data-theme="dark"] .edit-form-container .card-body {
        background: var(--secondary-800);
    }

    [data-theme="dark"] .edit-form-container .form-control {
        background: var(--secondary-900);
        border-color: var(--secondary-700);
        color: var(--border-light);
    }

    [data-theme="dark"] .edit-form-container .form-control:focus {
        background: var(--secondary-800);
        border-color: var(--primary-500);
    }

    [data-theme="dark"] .edit-form-container .form-select {
        background: var(--secondary-900);
        border-color: var(--secondary-700);
        color: var(--border-light);
    }

    [data-theme="dark"] .edit-form-container .form-select:focus {
        background: var(--secondary-800);
        border-color: var(--primary-500);
    }

    [data-theme="dark"] .edit-form-container .action-btn.outline {
        border-color: var(--secondary-600);
        color: var(--border-light);
    }

    [data-theme="dark"] .edit-form-container .action-btn.outline:hover {
        border-color: var(--primary-500);
        color: var(--primary-400);
        background: var(--secondary-700);
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-form-container">
    <div class="card">
        <div class="card-header">
            <h4>Edit Child</h4>
            <p class="text-muted mt-2">Update child information</p>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="form-row">
                        <div class="col-md-6 mb-3">
                            <label for="firstname" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstname" name="firstname" value="{{ child.firstname }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastname" class="form-label">Middle Name</label>
                            <input type="text" class="form-control" id="lastname" name="lastname" value="{{ child.lastname }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="surname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="surname" name="surname" value="{{ child.surname }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="date_of_birth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ child.date_of_birth }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone_num" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone_num" name="phone_num" value="{{ child.phone_num }}">
                    </div>

                    <div class="mb-4">
                        <label for="id_number" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="id_number" name="id_number" value="{{ child.id_number if child.id_number is not none else '' }}">
                    </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('family.family', depo_id=register.id) }}" class="action-btn outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
