{% extends "base_f/base.html" %}

{% block page_title %}New Sponsor{% endblock %}

{% block content %}
<div class="mg-form-container">
    <div class="mg-page-header">
        <h2>New Sponsor</h2>
        <a href="{{ url_for('sponsor.index') }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="mg-card">
        <div class="card-header">
            <h4>Sponsor Details</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" placeholder="Sponsor name" required>
                    </div>
                    <div class="mg-form-group">
                        <label for="contact_person">Contact Person</label>
                        <input type="text" id="contact_person" name="contact_person" placeholder="Full name">
                    </div>
                </div>

                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com">
                    </div>
                    <div class="mg-form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" placeholder="+254 700 000 000">
                    </div>
                </div>

                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="sponsorship_type">Sponsorship Type</label>
                        <select id="sponsorship_type" name="sponsorship_type">
                            <option value="">Select type...</option>
                            <option value="Financial">Financial</option>
                            <option value="In-Kind">In-Kind</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mg-form-group">
                        <label for="amount">Amount (Ksh)</label>
                        <input type="number" id="amount" name="amount" min="0" placeholder="0">
                    </div>
                </div>

                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="start_date">Start Date</label>
                        <input type="date" id="start_date" name="start_date">
                    </div>
                    <div class="mg-form-group">
                        <label for="end_date">End Date</label>
                        <input type="date" id="end_date" name="end_date">
                    </div>
                </div>

                <div class="mg-form-row">
                    <div class="mg-form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="Active">Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="mg-form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Physical address">
                    </div>
                </div>

                <div class="mg-form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Additional details..."></textarea>
                </div>

                <div class="mg-form-actions">
                    <button type="submit" class="btn btn-primary">Create Sponsor</button>
                    <a href="{{ url_for('sponsor.index') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
