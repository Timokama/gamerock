{% extends 'base_f/base.html' %}

{% block page_title %}Add Spouse{% endblock %}
{% block styles %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-transparent border-0 pt-4">
                <h4>Add Spouse</h4>
                <p class="text-muted mt-2">Add spouse information for {{ register.firstname }} {{ register.lastname }}</p>
            </div>
            <div class="card-body px-4 pb-4">
                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstname" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Enter first name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastname" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Enter last name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="surname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="surname" name="surname" placeholder="Enter surname" required>
                    </div>

                    <div class="mb-3">
                        <label for="date_of_birth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone_num" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone_num" name="phone_num" placeholder="Enter phone number" required>
                    </div>

                    <div class="mb-4">
                        <label for="id_number" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="id_number" name="id_number" placeholder="Enter ID number" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Spouse</button>
                        <a href="{{ url_for('family.family', depo_id=register.id) }}" class="action-btn outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
